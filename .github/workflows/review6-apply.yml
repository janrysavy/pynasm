name: Apply validated branch-expression repair
on:
  push:
    branches: [review/8086-branch-expression-regression]
    paths: [.review6.patch.zlib.b64, .github/workflows/review6-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply the locally tested patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('.review6.patch.zlib.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '424434418ad7f5042608681fa4aad09bd416b1191f49b84913e3218057d06362'
          pathlib.Path('/tmp/review6.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review6.patch
          git apply /tmp/review6.patch
          git diff --check
      - name: Validate before committing
        env:
          NASM: ''
        run: python -m unittest discover -s tests -v
      - name: Commit only the tested source and regression files
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/review/8086-branch-expression-regression | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/_layout.py pynasm/expression.py pynasm/assembler.py pynasm/_instruction_encoding.py tests/test_branch_layout_dependencies.py
          git commit -m 'fix: preserve source-position dependencies when relaxing 8086 branch expressions'
          git push origin HEAD:refs/heads/review/8086-branch-expression-regression
