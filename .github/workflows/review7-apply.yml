name: Apply validated variable-padding repair
on:
  push:
    branches: [review/8086-variable-padding]
    paths: [.review7.patch.zlib.b64, .github/workflows/review7-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply the locally tested patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('.review7.patch.zlib.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '81f0c10e65b9528368d262478f4ebc55851753cd5d54344542919699e24a8a67'
          pathlib.Path('/tmp/review7.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review7.patch
          git apply /tmp/review7.patch
          git diff --check
      - name: Validate before committing
        env:
          NASM: ''
        run: python -m unittest discover -s tests -v
      - name: Commit only tested source and regression files
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/review/8086-variable-padding | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/assembler.py pynasm/_instruction_encoding.py tests/test_variable_padding.py
          git commit -m 'fix: account for affine TIMES RES and DUP size changes during branch relaxation'
          git push origin HEAD:refs/heads/review/8086-variable-padding
