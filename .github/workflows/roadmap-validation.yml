name: Pinned NASM roadmap validation
on:
  pull_request:
permissions:
  contents: write
jobs:
  oracle:
    if: github.head_ref == 'review/nasm-roadmap-template-ledger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: netwide-assembler/nasm
          ref: 4a56d66ed9626d5a3ded5414c9d8b7f1a48ce065
          path: _nasm-oracle
          persist-credentials: false
      - name: Build pinned NASM 3.02 and expanded instruction table
        working-directory: _nasm-oracle
        run: |
          sh autogen.sh
          ./configure LDFLAGS=-static
          make -j2 nasm
          ./nasm -v
      - name: Generate independently pinned fixtures and verify tests
        run: |
          mkdir -p validation
          python -m tests.build_roadmap_fixtures --expanded _nasm-oracle/x86/insns.xda --nasm "$PWD/_nasm-oracle/nasm" | tee validation/generation.log
          git apply --check .review-docs.patch
          git apply .review-docs.patch
          NASM="$PWD/_nasm-oracle/nasm" python -m unittest discover -s tests -v > validation/tests.log 2>&1
          python -m tests.stress_templates --expanded _nasm-oracle/x86/insns.xda --nasm "$PWD/_nasm-oracle/nasm" > validation/templates.log
          python -m tests.stress_integer_boundaries --nasm "$PWD/_nasm-oracle/nasm" --cpu 8086 > validation/integer8086.log
          python -m tests.stress_integer_boundaries --nasm "$PWD/_nasm-oracle/nasm" --cpu 8088 > validation/integer8088.log
      - name: Commit verified fixtures to this PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/generated/nasm302_template_ledger.json tests/fixtures/generated/integer_boundaries.json tests/fixtures/generated/integer_boundaries.O0.bin tests/fixtures/generated/integer_boundaries.O1.bin tests/fixtures/generated/integer_boundaries.O9.bin doc/TESTS.md doc/PROGRESS.md doc/FUTURE_TESTS.md
          git commit -m 'test: retain NASM-generated ledger and integer boundary goldens'
          git push origin HEAD:review/nasm-roadmap-template-ledger
          git ls-tree -r HEAD > validation/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasm-roadmap-verified
          path: validation/
          retention-days: 7
