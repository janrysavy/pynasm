name: Pinned NASM layout validation
on:
  pull_request:
permissions:
  contents: write
jobs:
  oracle:
    if: github.head_ref == 'review/nasm-layout-interactions' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: netwide-assembler/nasm
          ref: 4a56d66ed9626d5a3ded5414c9d8b7f1a48ce065
          path: _nasm-oracle
          persist-credentials: false
      - name: Build pinned NASM 3.02
        working-directory: _nasm-oracle
        run: |
          sh autogen.sh
          ./configure LDFLAGS=-static
          make -j2 nasm
          ./nasm -v
      - name: Apply reviewed fixes and regenerate independent goldens
        run: |
          mkdir -p validation
          git apply --check .review-layout.patch
          git apply .review-layout.patch
          python -m tests.build_program_fixtures --nasm "$PWD/_nasm-oracle/nasm" | tee validation/generation.log
          NASM="$PWD/_nasm-oracle/nasm" python -m unittest discover -s tests -v > validation/tests.log 2>&1
          for seed in 20260930 8086; do
            for cpu in 8086 8088; do
              python -m tests.stress_program_layout --interactions --count 120 --seed "$seed" --cpu "$cpu" --nasm "$PWD/_nasm-oracle/nasm" > "validation/programs-$seed-$cpu.log"
            done
          done
      - name: Commit tested fixes and fixtures to this PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/assembler.py pynasm/_instruction_encoding.py tests/stress_program_layout.py doc/TESTS.md doc/PROGRESS.md doc/FUTURE_TESTS.md tests/fixtures/generated/layout_interactions
          git commit -m 'fix: keep late alignment labels consistent and validate NOBITS attributes'
          git push origin HEAD:review/nasm-layout-interactions
          git ls-tree -r HEAD > validation/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasm-layout-verified
          path: validation/
          retention-days: 7
