name: Apply validated ALU immediate repair
on:
  push:
    branches: [review/8086-alu-relocation-width]
    paths: [.review9.patch.zlib.b64, .github/workflows/review9-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checked patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('.review9.patch.zlib.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '5143ce086c371c958bec27ec69ca1a3248d0155640bf9476cc36cf68dcf02024'
          pathlib.Path('/tmp/review9.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review9.patch
          git apply /tmp/review9.patch
          git diff --check
      - name: Test before publishing
        env:
          NASM: ''
        run: python -m unittest discover -s tests -v
      - name: Publish tested files on this PR branch only
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/review/8086-alu-relocation-width | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/_instruction_encoding.py tests/test_alu_relocation_width.py
          git commit -m 'fix: retain word width for relocatable NASM3 ALU immediates'
          git push origin HEAD:refs/heads/review/8086-alu-relocation-width
