name: 8086 review validation
on:
  pull_request:
permissions:
  contents: write
jobs:
  wrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/8086-short-branch-wrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/8086-short-branch-wrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed range validation and test
        env:
          NASM: ''
        run: |
          git apply --check .review-fix.patch
          git apply .review-fix.patch
          python -m unittest discover -s tests -v
      - name: Commit tested source to this PR only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/_instruction_encoding.py
          git commit -m 'fix: validate selected 8086 short branches modulo 16-bit IP'
          git push origin HEAD:review/8086-short-branch-wrap
