name: 8086 review validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  nasm302:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: netwide-assembler/nasm
          # NASM 3.02, pinned independently of the runner's installed NASM.
          ref: 4a56d66ed9626d5a3ded5414c9d8b7f1a48ce065
          path: _nasm-oracle
          persist-credentials: false
      - name: Build NASM 3.02 oracle
        working-directory: _nasm-oracle
        run: |
          sh autogen.sh
          ./configure LDFLAGS=-static
          make -j2 nasm
          ./nasm -v
      - name: Assemble pinned and live differential tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          NASM="$PWD/_nasm-oracle/nasm" python -m unittest discover -s tests -v 2>&1 | tee validation/tests.log
      - name: Collect reproducible review inputs
        if: always()
        run: |
          mkdir -p validation
          git archive --format=tar HEAD > validation/source.tar
          git rev-parse HEAD > validation/source-commit.txt
          if test -f _nasm-oracle/nasm; then cp _nasm-oracle/nasm validation/nasm; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review8086-validation
          path: validation/
          retention-days: 7
