name: 8086 review validation
on:
  pull_request:
permissions:
  contents: write
jobs:
  nasm302:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/8086-jmp-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/8086-jmp-alignment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed patch and test pinned corpora
        shell: bash
        env:
          NASM: ''
        run: |
          set -o pipefail
          sed 's/^ diff --git /diff --git /' .review-fix.patch > "$RUNNER_TEMP/fix.patch"
          git apply --check "$RUNNER_TEMP/fix.patch"
          git apply "$RUNNER_TEMP/fix.patch"
          python -m unittest discover -s tests -v
      - name: Commit tested source to this PR only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/_instruction_encoding.py pynasm/assembler.py
          git commit -m 'fix: use resolved alignment metadata for 8086 branch relaxation'
          git push origin HEAD:review/8086-jmp-alignment
