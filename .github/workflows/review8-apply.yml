name: Apply validated scalar-relocation repair
on:
  push:
    branches: [review/8086-scaled-relocations]
    paths: [.review8.patch.zlib.b64, .github/workflows/review8-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checked patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('.review8.patch.zlib.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == 'b5b24ce12e5b2c79527f03f19de6b094184477c1c06421c2c42a4c0d2df2f656'
          pathlib.Path('/tmp/review8.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review8.patch
          git apply /tmp/review8.patch
          git diff --check
      - name: Test before publishing
        env:
          NASM: ''
        run: python -m unittest discover -s tests -v
      - name: Publish tested files on this PR branch only
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/review/8086-scaled-relocations | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/expression.py tests/test_scaled_relocations.py
          git commit -m 'fix: preserve scalar relocation products and reject non-relocatable expressions'
          git push origin HEAD:refs/heads/review/8086-scaled-relocations
