name: Apply validated EQU-resolution repair
on:
  push:
    branches: [review/8086-equ-branch-resolution]
    paths: [.review10.patch.zlib.b64, .github/workflows/review10-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checked patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('.review10.patch.zlib.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == 'ffe96a838f0fb904447562fbcbd2271af935fb61ee5cb68646f44b9427628c80'
          pathlib.Path('/tmp/review10.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review10.patch
          git apply /tmp/review10.patch
          git diff --check
      - name: Test before publishing
        env:
          NASM: ''
        run: python -m unittest discover -s tests -v
      - name: Publish tested files on this PR branch only
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/review/8086-equ-branch-resolution | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pynasm/assembler.py pynasm/_instruction_encoding.py tests/test_equ_branch_resolution.py
          git commit -m 'fix: preserve unresolved EQU state in 8086 conditional-branch sizing'
          git push origin HEAD:refs/heads/review/8086-equ-branch-resolution
