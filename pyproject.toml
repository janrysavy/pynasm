[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynasm"
version = "0.1.0"
description = "Pure Python NASM-style 8086/8088 flat binary assembler"
requires-python = ">=3.10"

[project.scripts]
pynasm = "pynasm.cli:main"

[tool.setuptools.packages.find]
include = ["pynasm*"]
